<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Goole Wordlers</title><meta name="color-scheme" content="light dark">
<style>
:root{--bg:#fbfaf7;--hd:#f2ead0;--hdb:#e2d8b0;--card:#fff;--tx:#1c1c1a;--tx2:#5f5e5a;--bd:#e3e1d9;--ok:#e3f1d9;--okt:#27500a;--wn:#fbefd0;--wnt:#633806;--er:#fbe1e1;--ert:#791f1f;--nn:#efede6;--nnt:#5f5e5a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1a19;--hd:#1f2d1f;--hdb:#33463a;--card:#242422;--tx:#f0efec;--tx2:#b4b2a9;--bd:#383835;--ok:#27401a;--okt:#c0dd97;--wn:#4a3a10;--wnt:#fac775;--er:#4a1b1b;--ert:#f7c1c1;--nn:#2f2f2c;--nnt:#b4b2a9}}
:root[data-theme="dark"]{--bg:#1a1a19;--hd:#1f2d1f;--hdb:#33463a;--card:#242422;--tx:#f0efec;--tx2:#b4b2a9;--bd:#383835;--ok:#27401a;--okt:#c0dd97;--wn:#4a3a10;--wnt:#fac775;--er:#4a1b1b;--ert:#f7c1c1;--nn:#2f2f2c;--nnt:#b4b2a9}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:14px;max-width:560px;margin:0 auto}
h1{font-size:20px;font-weight:600;margin:0 0 10px}
.hd{margin:-14px -14px 16px;padding:12px 14px;background:var(--hd);border-bottom:1px solid var(--hdb)}
.hd .logo{display:block;margin:0 auto 6px;width:84%;max-width:320px;height:auto}
.hd .upd{margin:0 0 10px;text-align:center;font-size:11px;font-weight:600;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .rule{margin:0 0 10px;text-align:center;font-size:11.5px;color:var(--tx2)}
.hd .tabs{margin-bottom:0}
#sub{margin-top:8px;text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}h2{font-size:15px;font-weight:600;margin:18px 0 6px}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--bd);padding:3px;border-radius:10px;margin-bottom:12px}
.tabs button{flex:1 1 auto;border:0;background:none;color:var(--tx2);font:inherit;font-size:12.5px;padding:7px 2px;border-radius:7px;white-space:nowrap}
.tabs button.on{background:var(--tx);color:var(--bg);font-weight:600}
select{font:inherit;font-size:14px;padding:7px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);margin-bottom:12px;width:100%}
.mt{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.m{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 12px}.m small{color:var(--tx2);font-size:12px;display:block}.m b{font-size:19px;font-weight:600}
.pl{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;gap:12px;align-items:center}
.nm{width:112px;flex:none;font-weight:600;font-size:14px}.nm small{display:block;font-weight:400;color:var(--tx2);font-size:11px}
.sc{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;border-radius:12px;font-size:13px;font-weight:600;padding:0 4px}
.ok{background:var(--ok);color:var(--okt)}.wn{background:var(--wn);color:var(--wnt)}.er{background:var(--er);color:var(--ert)}.nn{background:var(--nn);color:var(--nnt)}
.tg{display:grid;grid-template-columns:repeat(5,13px);gap:2px;flex:none}.tg i{width:13px;height:13px;border-radius:2px}
.G{background:#4a9a4a}.Y{background:#d9a720}.X{background:#787c7e}
.cnt{font-size:12px;color:var(--tx2);line-height:1.45}
.bar{display:flex;height:18px;border-radius:4px;overflow:hidden;gap:2px;background:var(--nn)}.bar div{height:100%}
.lg{display:flex;gap:14px;font-size:12px;color:var(--tx2);margin-top:5px;flex-wrap:wrap}
.r{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:14px}.r .n{width:112px;flex:none}.r .b{flex:1;height:14px;background:var(--nn);border-radius:3px;overflow:hidden}.r .b i{display:block;height:100%;background:#2a78d6}.r .t{width:34px;text-align:right;font-weight:600}
.sw{overflow-x:auto}table{border-collapse:separate;border-spacing:2px;width:100%;font-size:12px;min-width:300px}th{color:var(--tx2);font-weight:500;font-size:11px;text-align:center}td{text-align:center;padding:5px 2px;border-radius:4px}td.l{text-align:left;white-space:nowrap;padding-left:2px}
.note{font-size:12px;color:var(--tx2);margin:8px 0}
.sub{border:1px solid var(--bd);background:var(--card);color:var(--tx2);font:inherit;font-size:12px;padding:3px 11px;border-radius:14px}
.sub.on{background:var(--tx);color:var(--bg)}
.fold{border:1px solid var(--bd);border-radius:12px;background:var(--card);margin:16px 0 0;overflow:hidden}
.fold summary{list-style:none;cursor:pointer;padding:12px 14px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.fold summary::-webkit-details-marker{display:none}
.fold summary .fh{margin-left:auto;font-size:11px;font-weight:400;color:var(--tx2)}
.fold summary .fh::before{content:"Tap to open"}
.fold[open] summary .fh::before{content:"Tap to close"}
.fold summary::after{content:"\25BE";width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--nn);box-shadow:inset 0 0 0 1.5px var(--bd);font-size:13px;flex:none}
.fold[open] summary::after{content:"\25B4";background:var(--tx);color:var(--bg)}
.fold>div{padding:0 14px 14px;border-top:1px solid var(--bd)}
.s1{background:#7f56d9;color:#fff}.s2{background:#2a78d6;color:#fff}.s3{background:#2f9e44;color:#fff}.s4{background:#a6c438;color:#1c1c1a}.s5{background:#f0c020;color:#1c1c1a}.s6{background:#ee7d2b;color:#1c1c1a}.s7{background:#d03b3b;color:#fff}.s8{background:#0d0d0d;color:#fff;box-shadow:inset 0 0 0 1px #8a8a86}.s8::after{content:"✗";margin-left:1px}
.rk{width:24px;flex:none;text-align:center;font-size:15px;color:var(--tx2)}
.cm{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin:14px 0}.cm h3{font-size:16px;margin:2px 0 8px}.cm p{margin:0 0 8px;font-size:14px}.cm small{color:var(--tx2);font-size:12px}
</style></head><body>
