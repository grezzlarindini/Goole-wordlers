if(done&&PE.length==7){const PT=tot(PE),PR=n=>1+PT.filter(q=>q.t<PT.find(z=>z.p==n).t).length,d=T.map((r,i)=>({p:r.p,c:PR(r.p)-R[i]})).sort((a,b)=>b.c-a.c);if(d[0].c>0)F.push(["Biggest climber",d[0].p+" (up "+d[0].c+")"]);if(d[d.length-1].c<0)F.push(["Biggest fall",d[d.length-1].p+" (down "+-d[d.length-1].c+")"])}
if(lo>m)F.push(["Wooden spoon",T.filter(r=>r.t==lo).map(r=>r.p).join(", ")+" ("+lo+")"]);
const md=i=>R[i]==1?"🥇":R[i]==2?"🥈":R[i]==3?"🥉":(T[i].t==lo&&lo>m?"🥄":R[i]),c=C[cur];
let h='<tr><th></th>';for(let i=0;i<7;i++)h+='<th>'+fd(add(cur,i),{weekday:"short"})+'<br>'+fd(add(cur,i),{day:"numeric"})+'</th>';h+='<th>Tot</th></tr>';
T.forEach(r=>{h+='<tr><td class="l">'+r.p+'</td>';for(let i=0;i<7;i++){const x=E.find(y=>y.d==add(cur,i));h+=x?'<td class="'+cl(sc(x.r[r.p]))+'">'+sc(x.r[r.p])+'</td>':'<td class="nn">·</td>'}h+='<td><b>'+r.t+'</b></td></tr>'});
T.forEach((r,i)=>{h=h.replace('<td class="l">'+r.p+'</td>','<td class="l">'+md(i)+' '+r.p+'</td>')});
return sel(W,cur,k=>"Week of "+fd(k,{day:"numeric",month:"short"})+(L.filter(x=>wk(x.d)==k).length<7?" (in progress)":""))+
'<div class="m" style="margin-bottom:12px"><small>'+(done?(w.length>1?"Weekly winners (tied)":"Weekly winner"):"Leading after "+E.length+" of 7 days")+'</small><b>'+w.join(" & ")+'</b><small>'+m+' total</small></div>'+
'<h2>Day by day</h2><p class="note">Green is 3 or better, red is 6 or worse.</p><div class="sw"><table>'+h+'</table></div>'+
'<div class="cm"><small>The week in review</small>'+(c?'<h3>'+c.h+'</h3>'+c.t.map(p=>'<p>'+p+'</p>').join(""):'<p>Commentary lands once the week has wrapped up.</p>')+'</div>'+
(F.length?'<div class="mt">'+F.map(f=>'<div class="m"><small>'+f[0]+'</small><b style="font-size:15px">'+f[1]+'</b></div>').join("")+'</div>':'')+
'<h2>Standings</h2>'+T.map((r,i)=>'<div class="r"><span class="rk">'+md(i)+'</span><span class="n">'+r.p+'</span><span class="b"><i style="width:'+r.t/mx*100+'%"></i></span><span class="t">'+r.t+'</span></div>').join("")}
const PH={};
function alltime2(){const L=cd(),T=tot(L),R=T.map(r=>1+T.filter(q=>q.t<r.t).length),lo=T[T.length-1].t,m=T[0].t;
const md=i=>R[i]==1?"🥇":R[i]==2?"🥈":R[i]==3?"🥉":(T[i].t==lo&&lo>m?"🥄":R[i]);
const ww=weekWins(L),GD=ds().filter(d=>P.some(p=>typeof d.r[p]=="string")),WK={};
L.forEach(d=>{(WK[wk(d.d)]=WK[wk(d.d)]||[]).push(d)});
const FW=Object.keys(WK).filter(k=>WK[k].length==7);
const I=T.map(r=>{const p=r.p;let g=0,y=0,x=0,rd=0;GD.forEach(d=>{const v=d.r[p];if(typeof v=="string"){const a=tl(v);g+=a[0];y+=a[1];x+=a[2]}else if(sc(v)==7)rd+=30});const ws=FW.map(k=>WK[k].reduce((a,d)=>a+sc(d.r[p]),0)).sort((a,b)=>a-b);return{p,t:r.t,g,y,x,rd,n:g+y+x+rd,b:ws[0],w:ws[ws.length-1],wn:ww.o[p],dw:L.filter(d=>sc(d.r[p])==Math.min(...P.map(q=>sc(d.r[q])))).length,ms:L.filter(d=>sc(d.r[p])==7).length}});
const av=p=>PH[p]?'<img alt="" src="'+PH[p]+'" style="width:36px;height:36px;border-radius:50%;object-fit:cover;flex:none">':'<span class="sc nn" style="width:36px;height:36px;border-radius:18px;flex:none">'+p.split(" ").map(w=>w[0]).join("").slice(0,2)+'</span>';
const row=(a,b)=>'<div style="display:flex;justify-content:space-between;font-size:13px;padding:2px 0"><span style="color:var(--tx2)">'+a+'</span><b style="font-size:14px">'+b+'</b></div>';
const sq=(c,t)=>'<span><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:'+c+';margin-right:4px"></i>'+t+'</span>';
return ''+

'<h2>The Grand Tally</h2><p class="note">Running total across '+L.length+' days entered, lowest is best. The number on the right is each player’s score.</p><div class="lg" style="margin:0 0 6px">'+sq("#4a9a4a","Green")+sq("#d9a720","Yellow")+sq("#787c7e","Black")+sq("#d03b3b","Miss or no score")+'</div>'+
I.map((r,i)=>{const n=r.n||1,s=(c,v)=>'<i style="width:'+v/n*100+'%;background:'+c+'"></i>';return '<div class="r"><span class="rk">'+md(i)+'</span><span class="n">'+r.p+'</span><span class="b" style="display:flex">'+s("#4a9a4a",r.g)+s("#d9a720",r.y)+s("#787c7e",r.x)+s("#d03b3b",r.rd)+'</span><span class="t">'+r.t+'</span></div>'}).join("")+
'<p class="note">Bars cover every day with a tile grid so far (from 19 Oct). A miss or no score counts as a full six-row grid of red.</p>'+
'<h2>Weeks won and average</h2><div class="sw"><table><tr><th></th><th>Weeks won</th><th>Avg score</th><th>Days won</th><th>Misses</th></tr>'+I.slice().sort((a,b)=>b.wn-a.wn||a.t-b.t).map(r=>'<tr><td class="l">'+r.p+'</td><td><b>'+r.wn+'</b></td><td>'+(r.t/L.length).toFixed(2)+'</td><td>'+r.dw+'</td><td>'+r.ms+'</td></tr>').join("")+'</table></div><p class="note">Weeks won counts full Monday to Sunday weeks. Tied weeks share the win.</p>'+
'<h2>Players</h2><div class="mt">'+I.map(r=>{const tt=r.g+r.y+r.x;return '<div class="m" style="padding:12px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">'+av(r.p)+'<b style="font-size:14px;line-height:1.2">'+r.p+'</b></div>'+row("Weeks won",r.wn)+row("Best week",r.b==null?"–":r.b)+row("Worst week",r.w==null?"–":r.w)+row("Green tiles",tt?pc(r.g,tt)+"%":"–")+'</div>'}).join("")+'</div><p class="note">Best and worst use full Monday to Sunday weeks only.</p>'}
const cd=()=>{const L=ds(),c={};L.forEach(x=>{c[wk(x.d)]=(c[wk(x.d)]||0)+1});return L.filter(x=>c[wk(x.d)]==7)};
const V={daily:track,weekly:weekly2,alltime:alltime2};
function go(){$("#tabs").innerHTML=[["weekly","Weekly Winner"],["alltime","Hall of Fame"]].map(t=>'<button class="'+(view==t[0]?"on":"")+'" onclick="view=\''+t[0]+'\';go()">'+t[1]+'</button>').join("");$("#sub").innerHTML='<button class="sub'+(view=="daily"?" on":"")+'" onclick="view=\'daily\';go()">Who’s in</button>';$("#v").innerHTML=V[view]()}
go();
</script></body></html>
